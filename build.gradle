plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    // JEI 官方 maven（m205 看板#15）；content 过滤只放行 mezz.jei，防仓库串扰拖慢解析
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // m414：mojmap 分支核心开关——Yarn 换 Mojang 官方映射（m409 拍板路线）。
    // 依赖 jar（fabric-api/JEI）发行态都是 intermediary，Loom 无条件远端映射到当前 named 层，两套映射通吃。
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JEI 仅编译期（m205 立、m208/m209 两修）：modCompileOnly=Loom 远端映射到 Yarn 但不进运行时，
    // 玩家不装 JEI 零影响；插件类由 jei_mod_plugin entrypoint 惰性加载。
    // 血泪（m208/m209）：拆件 API 在 19.21.0.x 的发布口径有历史包袱——`common-api` 为 Mojang 官方映射直发，
    // 且换 intermediary 拆件后 mojmap 版仍经传递解析漏回类路径（作者两轮同错实测）。
    // 终解：直接引全量 fabric 正式 jar——remapJar 产物内含 fabric.mod.json，Loom 无条件远端映射到 Yarn；
    // API 类全在其中；transitive=false 斩断 POM 把 mojmap 拆件拖回来的通道。
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8'; it.options.compilerArgs += ['-Xmaxerrs', '5000'] } // m412 编码显式化；m414 放开报错上限（默认100条封顶=清单截断，m257 假绿同族）

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// m369 代际骨架第一刀：Common 名册 22 文件物理迁至 common/src/main/java（Common/Legacy/Modern
// 三层的公共层），本源集直接挂载——类照旧编进本 jar，产物内容与迁移前逐字节相同。
// 刻意不做独立 java-library 子项目：纯 Java 子项目的产物不会自动进 Loom remap jar（需 shade/JiJ
// 平添打包风险），共享源集=零打包变化；versions/26.2 新世代构建同样挂载此目录（m370）。
sourceSets {
    main {
        java {
            srcDir 'common/src/main/java'     // Core（零 MC，m369）
            srcDir 'xplat/src/main/java'      // m406 业务层（见 MC、不见加载器）
        }
    }
}

// m297：GameTest 运行配置（gradlew runGametest 起临时服务器跑完即退，报告出 build/junit.xml）
loom {
	runs {
		gametest {
			server()
			name = "GameTest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
			runDir "build/gametest"
		}
	}
}

// m318 旧版本产物自动清扫：版本号一笔一跳(m317)后 Gradle 不会删旧版 jar，build/libs 会
// 新旧并存——作者"拉取并构建"工具按文件名从 build/libs 选产物，0.0.1 排序在 0.1.317 前
// 被捡走（实锤事故：源码已最新、构建全 UP-TO-DATE、进 mods 的却是 sdzjz-0.0.1.jar）。
// 每次 build 收尾把 libs 里不含当前版本号的 jar 全删，工具想捡错都没得捡。
tasks.register('purgeStaleJars', Delete) {
    delete fileTree('build/libs') {
        include '*.jar'
        exclude "*${project.version}*"   // 保当前版 jar 与 -sources.jar
    }
}
build.finalizedBy 'purgeStaleJars'

// ===== m411 一键出改名对照表（作者选了 A 路线：活在有网有工具链的机器上干）=====
// 沙箱到不了 Mojang 域名，所以这最后一段桥只能在作者机器上搭。跑法：
//     gradlew mojmapTable
// 干三件事：①下 Mojang 官方 proguard（obf↔Mojmap）②下 FabricMC/intermediary 的 1.21.1.tiny
// （obf↔intermediary）③下 FabricMC/yarn@1.21.1 全仓（intermediary↔Yarn），
// 三段一拼，按 docs/mapping_used.json（本仓在用的 167 个 Yarn 类型）出 docs/MAPPING_TODO.md。
// 只写文档，不碰一行源码——改名动作另走 m409 定的分批+CI 判官流程。
tasks.register('mojmapTable') {
    group = 'sdzjz'
    description = '生成 Yarn→Mojmap 改名对照表（docs/MAPPING_TODO.md）'
    doLast {
        def mcVer = project.minecraft_version
        def out = layout.buildDirectory.dir('mojmap').get().asFile
        out.mkdirs()
        def slurper = new groovy.json.JsonSlurper()

        // ① Mojang 官方 proguard：版本清单 → 该版本 json → downloads.client_mappings.url
        def manifest = slurper.parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
        def entry = manifest.versions.find { it.id == mcVer }
        if (entry == null) throw new GradleException("版本清单里没有 ${mcVer}")
        def verJson = slurper.parse(new URL(entry.url))
        def pgFile = new File(out, 'client.txt')
        if (!pgFile.exists()) pgFile.withOutputStream { o -> new URL(verJson.downloads.client_mappings.url).withInputStream { i -> o << i } }

        // ② intermediary（obf ↔ class_NNNN）
        def interFile = new File(out, 'intermediary.tiny')
        if (!interFile.exists()) interFile.withOutputStream { o ->
            new URL("https://raw.githubusercontent.com/FabricMC/intermediary/master/mappings/${mcVer}.tiny").withInputStream { i -> o << i } }

        // ③ yarn 全仓（class_NNNN ↔ Yarn 名）
        def yarnTgz = new File(out, 'yarn.tgz')
        if (!yarnTgz.exists()) yarnTgz.withOutputStream { o ->
            new URL("https://codeload.github.com/FabricMC/yarn/tar.gz/refs/heads/${mcVer}").withInputStream { i -> o << i } }
        def yarnDir = new File(out, 'yarn')
        if (!yarnDir.exists()) copy { from tarTree(resources.gzip(yarnTgz)); into yarnDir }

        // 拼表
        def yarn2inter = [:]
        yarnDir.eachFileRecurse { f ->
            if (!f.name.endsWith('.mapping')) return
            def first = f.withReader('UTF-8') { it.readLine() } ?: ''
            if (!first.startsWith('CLASS ')) return
            def bits = first.trim().split(/\s+/)
            if (bits.length < 3) return
            yarn2inter[bits[2].replace('/', '.')] = bits[1].replace('/', '.')
        }
        def inter2obf = [:]
        interFile.eachLine('UTF-8') { line ->
            if (!line.startsWith('CLASS\t')) return
            def c = line.split('\t')
            if (c.length >= 3) inter2obf[c[2].replace('/', '.')] = c[1].replace('/', '.')
        }
        def obf2moj = [:]
        pgFile.eachLine('UTF-8') { line ->
            if (line.startsWith(' ') || line.startsWith('\t') || !line.contains('->')) return
            def parts = line.split('->')
            obf2moj[parts[1].trim().replaceAll(':$', '')] = parts[0].trim()
        }

        def used = slurper.parse(new File(projectDir, 'docs/mapping_used.json'))
        def rows = used.entrySet().sort { -it.value }
        def sb = new StringBuilder()
        sb << '# Yarn → Mojmap 改名对照表（m411 `gradlew mojmapTable` 生成，勿手改）\n\n'
        sb << "> MC ${mcVer}；三段桥：Yarn↔intermediary（yarn 仓）· obf↔intermediary（intermediary 仓）· obf↔Mojmap（Mojang 官方 proguard）。\n"
        sb << '> 本表只是对照，**改名动作走分批替换 + CI 五 job/GameTest 判官**（m409 口径）。\n\n'
        sb << '| 用点 | Yarn | Mojmap |\n|---:|---|---|\n'
        int done = 0
        rows.each { e ->
            def inter = yarn2inter[e.key]
            def obf = inter ? inter2obf[inter] : null
            def moj = obf ? obf2moj[obf] : null
            if (moj) done++
            sb << "| ${e.value} | `${e.key}` | ${moj ? '`' + moj + '`' : '—（查不到，人工核）'} |\n"
        }
        new File(projectDir, 'docs/MAPPING_TODO.md').setText(sb.toString(), 'UTF-8')
        println "[sdzjz] 对照表已写 docs/MAPPING_TODO.md：${rows.size()} 行，Mojmap 列补齐 ${done} 行"
    }
}

// ===== m413 成员级对照表（方法/字段层）：gradlew mojmapMembers =====
// m412 说"方法层没有可离线核对的表"——现在有了：同一套三段桥下潜到 METHOD/FIELD 层
// （yarn .mapping 的成员行 ↔ intermediary tiny 的成员行 ↔ proguard 的成员行，按描述符精确对接，
// 不做同名模糊匹配）。按本仓源码里实际出现的标识符过滤，只出 Yarn≠Mojmap 的行。
// 依旧只写 docs/MAPPING_MEMBERS.tsv 不碰源码：改名之手是人+真编译器，表只负责让"修"变成"查"。
tasks.register('mojmapMembers') {
    group = 'sdzjz'
    description = '生成 Yarn→Mojmap 成员（方法/字段）对照表（docs/MAPPING_MEMBERS.tsv）'
    doLast {
        def mcVer = project.minecraft_version
        def out = layout.buildDirectory.dir('mojmap').get().asFile
        out.mkdirs()
        def slurper = new groovy.json.JsonSlurper()

        // 三份下载物与 mojmapTable 共用缓存（存在就跳过）
        def pgFile = new File(out, 'client.txt')
        if (!pgFile.exists()) {
            def manifest = slurper.parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
            def entry = manifest.versions.find { it.id == mcVer }
            if (entry == null) throw new GradleException("版本清单里没有 ${mcVer}")
            def verJson = slurper.parse(new URL(entry.url))
            pgFile.withOutputStream { o -> new URL(verJson.downloads.client_mappings.url).withInputStream { i -> o << i } }
        }
        def interFile = new File(out, 'intermediary.tiny')
        if (!interFile.exists()) interFile.withOutputStream { o ->
            new URL("https://raw.githubusercontent.com/FabricMC/intermediary/master/mappings/${mcVer}.tiny").withInputStream { i -> o << i } }
        def yarnTgz = new File(out, 'yarn.tgz')
        if (!yarnTgz.exists()) yarnTgz.withOutputStream { o ->
            new URL("https://codeload.github.com/FabricMC/yarn/tar.gz/refs/heads/${mcVer}").withInputStream { i -> o << i } }
        def yarnDir = new File(out, 'yarn')
        if (!yarnDir.exists()) copy { from tarTree(resources.gzip(yarnTgz)); into yarnDir }

        // ① 本仓源码标识符全集（过滤器：只出我们可能用到的名字）
        def tokens = new HashSet<String>()
        ['xplat/src/main/java', 'src/main/java'].each { root ->
            def dir = new File(projectDir, root)
            if (!dir.exists()) return
            dir.eachFileRecurse { f ->
                if (!f.name.endsWith('.java')) return
                (f.getText('UTF-8') =~ /[A-Za-z_][A-Za-z0-9_]*/).each { t -> tokens << (t as String) }
            }
        }

        // ② yarn：intermediary 成员名（全局唯一）→ Yarn 成员名
        def inter2yarn = [:]
        yarnDir.eachFileRecurse { f ->
            if (!f.name.endsWith('.mapping')) return
            f.eachLine('UTF-8') { line ->
                def mm = (line =~ /^\t*(METHOD|FIELD)\s+((?:method|field)_\d+)\s+([A-Za-z_][A-Za-z0-9_]*)\s/)
                if (mm.find()) inter2yarn[mm.group(2)] = mm.group(3)
            }
        }

        // ③ tiny：obf 成员（owner|name|desc 精确键）→ intermediary 成员名
        def tinyM = [:], tinyF = [:]
        interFile.eachLine('UTF-8') { line ->
            def c = line.split('\t')
            if (c.length >= 5 && c[0] == 'METHOD') tinyM[c[1] + '|' + c[3] + '|' + c[2]] = c[4]
            else if (c.length >= 5 && c[0] == 'FIELD') tinyF[c[1] + '|' + c[3] + '|' + c[2]] = c[4]
        }

        // ④ proguard 两遍：先攒 Mojmap 类→obf 类（供描述符换算），再走成员
        def m2o = [:]
        pgFile.eachLine('UTF-8') { line ->
            if (!line.startsWith(' ') && !line.startsWith('\t') && line.contains('->')) {
                def p = line.split('->'); m2o[p[0].trim()] = p[1].trim().replaceAll(':$', '')
            }
        }
        def prim = ['void':'V','int':'I','boolean':'Z','byte':'B','char':'C','short':'S','long':'J','float':'F','double':'D']
        def toDesc = { String t ->
            int dims = 0; def b = t
            while (b.endsWith('[]')) { dims++; b = b.substring(0, b.length() - 2) }
            def base = prim.containsKey(b) ? prim[b] : 'L' + ((m2o[b] ?: b).replace('.', '/')) + ';'
            ('[' * dims) + base
        }
        def rows = new TreeMap()   // yarnName -> (mojName -> owners)
        String curMoj = null, curObf = null
        int nM = 0, nF = 0
        pgFile.eachLine('UTF-8') { line ->
            if (!line.startsWith(' ') && !line.startsWith('\t')) {
                if (line.contains('->')) { def p = line.split('->'); curMoj = p[0].trim(); curObf = p[1].trim().replaceAll(':$', '').replace('.', '/') }
                return
            }
            if (curObf == null) return
            def inter = null, mojName = null, kind = null
            def mm = (line =~ /^\s+(?:\d+:\d+:)?(\S+)\s+([\w$]+)\((.*)\)\s+->\s+(\S+)\s*$/)
            if (mm.matches()) {
                mojName = mm.group(2)
                def desc = '(' + (mm.group(3) ? mm.group(3).split(',').collect { toDesc(it.trim()) }.join('') : '') + ')' + toDesc(mm.group(1))
                inter = tinyM[curObf + '|' + mm.group(4) + '|' + desc]; kind = 'M'
            } else if (!line.contains('(')) {
                def fm = (line =~ /^\s+(\S+)\s+([\w$]+)\s+->\s+(\S+)\s*$/)
                if (fm.matches()) {
                    mojName = fm.group(2)
                    inter = tinyF[curObf + '|' + fm.group(3) + '|' + toDesc(fm.group(1))]; kind = 'F'
                }
            }
            if (inter == null || mojName == null || mojName.contains('$')) return
            def yarnN = (inter ==~ /(?:method|field)_\d+/) ? inter2yarn[inter] : inter
            if (yarnN == null || yarnN == mojName || !tokens.contains(yarnN)) return
            def owners = rows.computeIfAbsent(kind + '\t' + yarnN, { new TreeMap() }).computeIfAbsent(mojName, { new TreeSet() })
            owners << curMoj.tokenize('.').last()
            if (kind == 'M') nM++ else nF++
        }
        def sb = new StringBuilder()
        sb << "# Yarn → Mojmap 成员对照表（m413 gradlew mojmapMembers 生成，勿手改）\n"
        sb << "# 过滤：仅本仓源码出现过的标识符 × 名字确实变了的成员；列=种类(M/F)\tYarn名\tMojmap名\t宿主类(样本)\n"
        rows.each { k, v -> v.each { mojN, owners ->
            sb << k << '\t' << mojN << '\t' << owners.take(6).join(',') << '\n' } }
        new File(projectDir, 'docs/MAPPING_MEMBERS.tsv').setText(sb.toString(), 'UTF-8')
        println "[sdzjz] 成员对照表已写 docs/MAPPING_MEMBERS.tsv：${rows.size()} 个 Yarn 名（方法命中 ${nM} 处、字段 ${nF} 处声明）"
    }
}
