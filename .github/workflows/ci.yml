# m175 CI:每次推送/PR 三道闸——①离线配方校验 ②全库资源审计 ③真编译出包
# 沙箱到不了 maven.fabricmc.net,历来只能【待编译验证】;GitHub 跑批机可达,就此闭环。
name: CI
on:
  push:
    branches: [ main, mojmap ]  # m414 迁移分支同享全套判官
  pull_request:
  workflow_dispatch:

jobs:
  offline-checks:
    name: 配方校验 + 资源审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 配方校验(多重集唯一/上限/笼数)
        run: python3 docs/tools_m172_check.py
      - name: 资源审计(JSON/双语言键/模型贴图/注册闭环)
        run: python3 docs/tools_ci_resources.py
      - name: 文档同步校验(README 机器数/机器清单 防漂移)
        run: python3 docs/tools_docs_sync.py
      - name: 画布取色作用域巡检(m255 回归尺,防事件路径裸取色)
        run: python3 docs/tools_color_scope_audit.py
      - name: 重复方法定义检查(m271 回归尺,冒烟盲区#3=参数类型不可解析时javac不报already defined)
        run: python3 docs/tools_dup_method_check.py
      - name: 拼音首字母回归尺(m282,护边界表/二级硬表/端到端口径)
        run: python3 docs/tools_pinyin_check.py
      - name: 有界Codec回归尺(m291,C2S含串/表的包必须走Bounded解码期拒越界)
        run: python3 docs/tools_bounded_codec_check.py
      - name: Override错挂检查(m288 回归尺,冒烟盲区#4=超类不可解析时javac跳过@Override校验)
        run: python3 docs/tools_override_check.py
      - name: 调度器算法尺(m302,全服预算+饥饿名单四不变量多种子模拟)
        run: python3 docs/tools_core_scheduler_sim.py
      - name: 版本号对表(m317,mod_version=0.1.<DEVLOG最新里程碑号> 一笔一跳忘跳即红)
        run: python3 docs/tools_version_check.py
      - name: Common 硬闸（Phase 1.5 ①②③）
        run: python3 docs/tools_common_gate.py
      - name: 事务作用域手账审计(m327 回归尺,m323 规矩=事务内禁 withdraw/deposit 防同键前像复制窗)
        run: python3 docs/tools_tx_scope_audit.py
      - name: 分层硬闸(m406 多源集,xplat 零加载器引用+待接口化清单)
        run: python3 docs/tools_layer_gate.py
      - name: Yarn 名残留闸(m423,主线自 m422 换 Mojmap 口径,防肌肉记忆倒退;mixin 靶点字符串编译器管不到)
        run: python3 docs/tools_yarn_residue_check.py
      - name: 坏尺子普查(m423 报告尺,恒退 0,只在日志里留供人工判的清单)
        run: python3 docs/tools_gauge_audit.py
      - name: 两代手抄名单对表(m470,仿写路线头号漏点=名单漏一条不报错判官照绿,m469 血案)
        run: python3 docs/tools_retro_parity_check.py
      - name: 节点栈 NBT 键位登记表(m474,两代共享命名空间;同键异义不报错只会以最难查的形式炸)
        run: python3 docs/tools_node_key_check.py
      - name: 双写普查(m477 真移植路线看门人,欠账账目上账;拦"随手再写一份仿品")
        run: python3 docs/tools_dualwrite_audit.py
      - name: 悬空引用闸(m487,补纯语法冒烟盲区:下沉后已删符号是否还有人在用)
        run: python3 docs/tools_dead_ref_check.py
      - name: 世代 API 闸(m490,共用层里不许出现 1.21 专属 API;m487 血案的形状)
        run: python3 docs/tools_gen_api_check.py
      - name: 裸调用实参个数闸(m510,冒烟第六类盲区=含不可解析类型实参的调用 javac 不做适用性判定;m481 主线断 28 刀的形状)
        run: python3 docs/tools_arity_check.py

  gametest:
    # m301：第九道闸——真跑全部 GameTest 用例（临时专用服务器，vanilla TestServer 免 EULA；
    # m297 六件 + m305 调度器 soak，后续新用例自动纳入）。报告 build/junit.xml 无论红绿都上传。
    name: GameTest 用例集
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # m310b 失败报告回推 ci-gametest-report 分支
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 跑 GameTest
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew runGametest --stacktrace --no-daemon 2>&1 | tee gradle-gametest.log
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-junit
          path: build/junit.xml
          retention-days: 30
          if-no-files-found: ignore
      - name: 失败报告回推分支(m310b,沙箱够不到artifact blob域名,raw域可读)
        if: failure()
        run: |
          git config user.name ci-bot
          git config user.email ci@local
          git checkout -B ci-gametest-report
          cp build/junit.xml ci-junit.xml 2>/dev/null || echo "junit.xml 未产出" > ci-junit.xml
          LOG=$(ls build/gametest/logs/latest.log 2>/dev/null || true)
          if [ -n "$LOG" ]; then tail -c 400000 "$LOG" > ci-server-tail.log; else echo "无服务器日志" > ci-server-tail.log; fi
          grep -E "error:|error |FAILED|Caused by" gradle-gametest.log > ci-gradle-errors.log 2>/dev/null || tail -c 60000 gradle-gametest.log > ci-gradle-errors.log 2>/dev/null || echo 无gradle日志 > ci-gradle-errors.log
          git add -f ci-junit.xml ci-server-tail.log ci-gradle-errors.log
          git commit -m "gametest 失败报告 $GITHUB_SHA" || true
          git push -f origin ci-gametest-report

  neoforge-1211:
    # m408 立：NeoForge 1.21.1 骨架闸=真编译出包（第二个加载器的第一块地基）。
    # 现阶段挂载范围只有 Core（common/ 零 MC 依赖），编得过即证明"同一份 Core 跨加载器可用"；
    # xplat 业务层因 Yarn↔Mojmap 映射分歧暂不挂（见 DEVLOG m408）。
    name: NeoForge 1.21.1：编译出包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 编译出包
        working-directory: versions/1.21.1/neoforge
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdzjz-neoforge-1.21.1
          path: versions/1.21.1/neoforge/build/libs/*.jar
          if-no-files-found: warn

  retro-1201:
    # m439 立/m443 升级（m440 排刀稿）：1.20.1 旧世代闸=真编译+GameTest 两段（账本核心行为判官
    # RetroStorageTests 七用例——事务回滚/不混堆/类型硬顶/NBT 往返；错误归 Retro 不污染 Legacy/Modern）。
    name: 1.20.1 旧世代：编译+GameTest
    runs-on: ubuntu-latest
    permissions:
      contents: write # m439b 编译错误清单回推 ci-retro-errors 分支（沙箱只可达 raw 域，m414 同款）
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 编译出包
        working-directory: versions/1.20.1
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee gradle-build.log
      - name: 跑 1.20.1 GameTest（账本行为判官，m443）
        working-directory: versions/1.20.1
        run: |
          set -o pipefail
          ./gradlew runGametest --stacktrace --no-daemon 2>&1 | tee gradle-gametest.log
      - name: 上传 1.20.1 测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retro-gametest-junit
          path: versions/1.20.1/build/junit.xml
          retention-days: 30
          if-no-files-found: ignore
      - name: 失败错误清单回推分支(m439b,m414同款；m443 并卷 gametest 日志与服务器尾日志)
        if: failure()
        run: |
          git config user.name ci-bot
          git config user.email ci@local
          git checkout -B ci-retro-errors
          cat versions/1.20.1/gradle-build.log versions/1.20.1/gradle-gametest.log > retro-all.log 2>/dev/null || true
          grep -B1 -A4 -E "\.java:[0-9]+: (error|错误)|FAILURE|FAILED|Could not" retro-all.log > ci-retro-errors.log || tail -c 200000 retro-all.log > ci-retro-errors.log
          SRVLOG=$(ls versions/1.20.1/build/gametest/logs/latest.log 2>/dev/null || true)
          if [ -n "$SRVLOG" ]; then tail -c 400000 "$SRVLOG" > ci-retro-server-tail.log; else echo "无服务器日志" > ci-retro-server-tail.log; fi
          git add -f ci-retro-errors.log ci-retro-server-tail.log
          git commit -m "retro 编译/GameTest 错误清单 $GITHUB_SHA" || true
          git push -f origin ci-retro-errors
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdzjz-1.20.1
          path: versions/1.20.1/build/libs/*.jar
          if-no-files-found: warn
  modern-bootstrap:
    # m370 立/m372 升级：26.2 新世代闸=真编译+装载+GameTest 三段（作者拍板：错误归 Modern
    # 不污染 Legacy）。GameTest 跑 ModernRecipeDomainTests（Common 共享判官喂 ModernRecipeAccess，
    # 与 Legacy 卅四号同套断言）——服务器能起=ModernBootstrap 装载验证，用例绿=行为绿。
    name: 26.2 新世代：编译+GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: 编译出包
        working-directory: versions/26.2
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon
      - name: 跑 26.2 GameTest（装载+行为判官）
        working-directory: versions/26.2
        run: ./gradlew runGametest --stacktrace --no-daemon
      - name: 上传 26.2 测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modern-gametest-junit
          path: versions/26.2/build/junit.xml
          retention-days: 30
          if-no-files-found: ignore
      - name: 上传 26.2 产物
        uses: actions/upload-artifact@v7
        with:
          name: sdzjz-26.2-jar
          path: versions/26.2/build/libs/*.jar
          retention-days: 30

  modern-261:
    # m432 立（镜像 26.2 作业）：26.1 新世代闸=真编译+装载+GameTest 三段（作者拍板：错误归 Modern
    # 不污染 Legacy）。GameTest 跑 ModernRecipeDomainTests（Common 共享判官喂 ModernRecipeAccess，
    # 与 Legacy 卅四号同套断言）——服务器能起=ModernBootstrap 装载验证，用例绿=行为绿。
    name: 26.1 新世代：编译+GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: 编译出包
        working-directory: versions/26.1
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon
      - name: 跑 26.1 GameTest（装载+行为判官）
        working-directory: versions/26.1
        run: ./gradlew runGametest --stacktrace --no-daemon
      - name: 上传 26.1 测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modern-261-gametest-junit
          path: versions/26.1/build/junit.xml
          retention-days: 30
          if-no-files-found: ignore
      - name: 上传 26.1 产物
        uses: actions/upload-artifact@v7
        with:
          name: sdzjz-26.1-jar
          path: versions/26.1/build/libs/*.jar
          retention-days: 30

  build:
    name: Gradle 编译出包
    runs-on: ubuntu-latest
    permissions:
      contents: write # m414 编译错误清单回推 ci-mojmap-errors 分支（沙箱只可达 raw 域）
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 编译
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee gradle-build.log
      - name: 失败错误清单回推分支(m414,javac逐条+两行上下文,供沙箱按批修)
        if: failure()
        run: |
          git config user.name ci-bot
          git config user.email ci@local
          git checkout -B ci-mojmap-errors
          grep -A4 -E "\.java:[0-9]+: (error|错误)" gradle-build.log > ci-javac-errors.log || tail -c 200000 gradle-build.log > ci-javac-errors.log
          echo "错误条数: $(grep -cE '\.java:[0-9]+: (error|错误)' gradle-build.log || echo 0)" >> ci-javac-errors.log
          git add -f ci-javac-errors.log
          git commit -m "mojmap 编译错误清单 $GITHUB_SHA" || true
          git push -f origin ci-mojmap-errors
      - name: jar内动画mcmeta断言(m319,排除"动画没打进包"假说)
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          N=$(unzip -l "$JAR" | grep -c 'png\.mcmeta' || true)
          echo "产物 $JAR 内 png.mcmeta = $N（期望 ≥76：3方块+73物品，m337 批量动画化63张入列）"
          test "$N" -ge 76
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: sdzjz-jar
          path: build/libs/*.jar
          retention-days: 30

  mapping-members:
    # m414：成员级对照表由跑批机代产（沙箱到不了 piston-meta，跑批机可达）——
    # gradlew mojmapMembers 只写文档不碰源码，产物回推 ci-mojmap-members 分支供沙箱 raw 域取用。
    name: 成员对照表代产
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 生成成员对照表
        run: |
          chmod +x gradlew
          ./gradlew mojmapTable mojmapMembers --no-daemon
      - name: 回推对照表分支
        run: |
          git config user.name ci-bot
          git config user.email ci@local
          git checkout -B ci-mojmap-members
          git add -f docs/MAPPING_MEMBERS.tsv docs/MAPPING_TODO.md
          git commit -m "成员对照表代产 $GITHUB_SHA" || true
          git push -f origin ci-mojmap-members
