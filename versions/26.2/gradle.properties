# m370 新世代坐标——出处：FabricMC/fabric-example-mod 分支 26.2 原文照抄；
# loader 0.19.3 已对 fabric-loader 最新 release 核实；loom 钉 1.17.19=作者本地
# 26.2 模板实测解析版（m325 同款：锁实测版防 SNAPSHOT 漂移，模板原文是 1.17-SNAPSHOT）。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 官方模板原话：IDEA 与新世代 Loom 的配置缓存兼容问题未收口，先关（fabric-loom#1349）
org.gradle.configuration-cache=false

minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.157.0+26.2

# ⚠ 命令行跑本构建需要 Gradle JVM=25（26.1 起官方最低要求）。CI 由 setup-java 提供 25；
# 本机若命令行默认 JDK 是 21（比如 SDZJZ 根仓的环境），解开下面这行并按你机器的实际
# 路径改（就是 26.2 模板验证时用过的那招）；在 IDEA 里则直接把本项目 Gradle JVM 选 25，
# 不需要这行。此行属本机配置，改完请勿提交。
# org.gradle.java.home=C:/Users/Administrator/.gradle/jdks/eclipse_adoptium-25-amd64-windows.2

# 版本号不在此文件：唯一数据源=根仓 gradle.properties 的 mod_version（m317 一笔一跳），
# build.gradle 读根文件拼 +mc26.2 尾缀，绝不双写。
