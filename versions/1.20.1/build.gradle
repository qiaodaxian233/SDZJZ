// m439 旧世代 bootstrap（1.20.1 锚点，m436 方案 P-B 第一段）。与新世代（26.x）三个关键差异
// （对照 versions/26.2/build.gradle 头注释）：①插件走经典 'fabric-loom'（有混淆，mappings 行
// 必须有——用 officialMojangMappings，代码仍写 Mojang 官方名）；②loader/fabric-api 用
// modImplementation（经典线口径）；③Java release 17（1.20.1 生态惯例）。
plugins {
    id 'fabric-loom' version "${loom_version}"
}

// 版本号唯一数据源=根仓 gradle.properties 的 mod_version（m317 一笔一跳），
// jar 尾缀带 MC 版本：sdzjz-0.1.NNN+mc1.20.1.jar。
def rootProps = new Properties()
file("../../gradle.properties").withInputStream { rootProps.load(it) }
version = rootProps.getProperty("mod_version") + "+mc1.20.1"
group = "com.sdzjz"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Common 层挂载：与根构建/26.x 同一份 common/src/main/java（零 MC 依赖，tools_common_gate
// 硬闸保证在此可编译，且已核零 Java 21 独有语法）。本构建自己的版本侧代码在 ./src/main/java
// （retro 包）。业务域（存储网络等）按 P-B 第二段起逐域移植，不在本 bootstrap。
// m451（C2-①）：xplat 白名单子集挂载——Sync 任务构建期从唯一源头拷贝进 build 目录，仓库零副本
// （m450 稿机制）；白名单显式列举，加一件=加一行，依赖不闭包=本作业编译红当场暴露（ModItems 雷区
// 见 m450 普查表）。首批只有 ItemData 门面（57 行零 1.20.5 触点）。
def xplatSubset = tasks.register('syncXplatSubset', Sync) {
    from('../../xplat/src/main/java') {
        include 'com/sdzjz/item/ItemData.java'
        include 'com/sdzjz/client/SciSkinPalette.java' // m452b 配色数值唯一出口（SciSkin 因内联 1.21 API 不可挂，见 DEVLOG）
        include 'com/sdzjz/client/SciSkin.java'        // m483（绞杀者第六刀）卡面工艺两代共用：326 行里只有 10 行世代专属（纹理 id 构造+顶点写法），已收进 Gfx 世代口（RetroSkinGfx）；drawCard/softShadow/glowLineH/vGrad/hGrad/vignette 自此在 1.20.1 可用
        include 'com/sdzjz/client/NodeCardRenderer.java' // m484（真移植·画布视觉第二件）节点卡渲染两代共用：主线 drawNode 216 行整段下沉，骨架层+六族逻辑节点读数行两代同一份；宿主数据走 Host 口，机器身份走 defOf 同一性，物品 id 走 Gfx.id 世代口
        include 'com/sdzjz/client/WireRenderer.java'    // m488（真移植·画布视觉第三件）连线缎带两代共用：主线 129 行整段搬（三次贝塞尔+三层缎带+彗星脉冲+端口发光圆点+m197 线宽封顶），唯一世代差=发顶点那四行走 Gfx.quadVC
        include 'com/sdzjz/client/MinimapRenderer.java' // m490（真移植·画布视觉第五件）小地图两代共用：主线 renderMinimap/mapGeom/mapJump 整段搬，世代差为零（全是 fill 与算术），pan/zoom 记法差异归一在 View 口
        include 'com/sdzjz/client/NodeTooltip.java'     // m493（真移植·画布视觉第六件）节点悬停详情两代共用：主线 m85 段整段搬（状态/周期/基础产量/产出表/消耗提示），两处世代差走 defOf 与 Gfx.id
        include 'com/sdzjz/client/GroupFrameRenderer.java' // m507（真移植·A5b）画布分组组框两代共用：主线 m192 组框段+groupMembers/groupRect 整段搬，世代差为零（fill/hGrad/drawString+算术），拖动覆盖/pan 记法/卡高归一在 View 口
        include 'com/sdzjz/client/CanvasMenu.java'         // m509（真移植·A5c 补刀）画布右键菜单机制两代共用：主线 m148 3A 菜单（状态/开合/装配/渲染/点选）整段搬，唯一世代差=贴图 id 构造走 SciSkin.gfxTex；m508 那份 1.20.1 最小菜单件已退役
        include 'com/sdzjz/client/WireBundler.java'        // m511（真移植·A4）画布连线归并 m193 两代共用：主线 seBundles/mmBundles 两段+GROUP_ENC/mmAnchorGeom/drawBundleBadge 整段搬，世代差为零（LinkedHashMap 计数+算术+fill/drawString），唯一参数化=存储端卡接口位置走 StoragePorts 口（总线放置卡 vs 24×24 存储节点卡）
        include 'com/sdzjz/client/ZoomAnim.java'           // m512（真移植·A6）画布缩放平滑动效两代共用：主线 m186 块（状态六件+m185 clampZoom+setViewInstant/zoomToward/tickZoomAnim+settle/stop）整段搬，世代差为零（算术+nanoTime+common 配置），pan↔viewX 记法换算在 Host 口
        include 'com/sdzjz/client/CanvasLayout.java'       // m514（真移植·A7b）「整理布局」落位几何两代共用：主线 autoLayout 算术段整段搬（m149 竖排/m221 间距配置/存储右列），发包留各代
        include 'com/sdzjz/client/CanvasSettingsPanel.java' // m515（真移植·A7c）画布设置面板两代共用：主线 m199/m211/m217/m223/m239/m262 整段搬（EditBox 两代同签名，1.20.1 m192 重命名框在树先例），宿主只给字体/屏幕尺寸/开窗前清场
        include 'com/sdzjz/client/CanvasHelpCard.java'       // m515 m219 帮助卡两代共用（纯静态，helpOpen 留宿主）
        include 'com/sdzjz/client/CanvasBackdrop.java'     // m516（真移植·A11）画布底层两代共用：主线 renderBg 开头底色/装饰底图/32px 双色网格/暗角原文整段搬，布局参数（网格起始 y/暗角区）留调用点，主线顶底浅带夹在两口之间不搬
        include 'com/sdzjz/machine/DropRolls.java'     // m464（C2-⑤a）掉落表掷点（依赖仅 RandomSource+MachineDef，闭包干净）
        include 'com/sdzjz/machine/StorageAccess.java' // m464（C2-⑤a）存储访问契约（依赖仅 ItemStack+Map；StorageCore120 补 implements 与主线辅件同型）
        include 'com/sdzjz/node/NodeTags.java'         // m472（绞杀者第五刀）节点栈标签纯函数上挂——NBT 走 ItemData 五口（m437/m451）、身份走 Ident 世代口（RetroNodeIdent），剩余 MC 触点=ItemStack/CompoundTag/Tag/ListTag 四个两代同名类型
        include 'com/sdzjz/node/CanvasGraphState.java'  // m477（真移植 A 阶段第一刀）画布图状态两代共用一份——原 CanvasGraphState120 仿写件已删；栈↔NBT 编解码走 StackCodec 世代口（RetroStackCodec），其余 122 行两代逐字同源
        include 'com/sdzjz/node/RouteBrain.java'        // m486（真移植·C 阶段主刀）路由脑判定层两代共用一份：accepts/chainWants/chainEndsInTrash/sensorOpen/extractorLive/allGatesClosed 逐句取自主线，只把身份判定换成 defOf 同一性、传感器库存来源换成 Host 口；1.20.1 那 128 行重写已删
        include 'com/sdzjz/node/ProductRouter.java'     // m495（B2 前置）产物分发两代共用：主线 distribute0 的两轮垫底与缓存投喂逐句搬，**两代唯一真差异（兜底：主线输出缓存+断网喷射 vs 本世代落仓回吐）收进 Tail 世代口**
        include 'com/sdzjz/node/SupplyPuller.java'      // m498（B2 收尾）拉料循环两代共用：主线 m92 段整段搬（含 m154 主动泵/m157 没去处不抽/m160 白名单/m163a 泵缓存放宽/m155→m158 精确账本授权支路），差异六处全参数化收进 Host
        include 'com/sdzjz/node/LogicNodeTicker.java'   // m499（B2 收尾）逻辑节点六分支两代共用：分配器/过滤器/垃圾桶/抽取/开关/传感器清运逐句照原文，灯表（真实世代差）收进 Host.lampAfterDrain
        include 'com/sdzjz/storage/StackKey.java'       // m478（真移植 B 阶段第一刀）精确账本身份键两代共用一份——原 TagStackKey 仿写件已删；相等与哈希走 Kind 世代口（RetroStackKind），其余逐字同源
        include 'com/sdzjz/storage/StorageLedger.java'   // m485（真移植·直接移除仿写件）存储账本核心两代共用一份：逐句取自主线 StorageCoreBlockEntity 139~275 行，只把 setChanged() 换成注入回调；1.20.1 原来那 181 行重写已删
        include 'com/sdzjz/block/CableEnd.java'         // m502（真移植 B4b）数据线端点三态枚举两代共用（纯 StringRepresentable，零版本 API）
        include 'com/sdzjz/block/CableEndCore.java'     // m502（真移植 B4b）数据线端点属性表/形状缓存/三态判定核心两代共用；名单字面留各世代 endFor（第16闸看着）
        include 'com/sdzjz/storage/Xfer.java'            // m502（真移植 B4a）五口传输门面本世代兑现（m434 注释预言"1.20.1 格照此同款"）——内脏由 RetroXfer 安装（FabricXfer 原文照搬）
        include 'com/sdzjz/storage/ExtractPort.java'     // m502（真移植 B4a）数据线抽取口业务两代共用：m225 逐模板抽/全部模式游标轮转/m231 回收拍/m228 六面视图/m218b 核心 40t 缓存整段取自主线；m229/m230/m233 主线专属功能收进带默认值的宿主口
        include 'com/sdzjz/storage/PanelAggregator.java' // m500（真移植 B3）数据面板聚合两代共用：主线 masterEntries（普通聚合+精确跨核心并账+m83 存量降序）与 repage 前半（过滤/钳滚动/开窗）整段搬；核心列表吃 StorageLedgerProbe 不另开接口；展示栈物化与缓存层留各世代自己那侧
        include 'com/sdzjz/machine/StorageLedgerProbe.java'      // m480 存储域行为契约探针（十三口，两代 BE 本来就有同名方法）
        include 'com/sdzjz/machine/StorageDomainAssertions.java' // m480 存储域跨代行为契约：一套断言两代各喂自己的实现（照 m372 RecipeDomainAssertions 样板）
        include 'com/sdzjz/node/RouteBrainProbe.java'            // m481 路由域判定探针（四口两代签名已对齐）
        include 'com/sdzjz/node/RouteDomainAssertions.java'      // m481 路由域跨代行为契约：六条成对判定，含「传感器两面刻意不同」那格
        include 'com/sdzjz/node/CanvasGroupAssertions.java'      // m506（真移植 A5a）画布分组域跨代行为契约：八条判定一份，两代各喂自己的栈（组件/tag）——分组六方法已在 CanvasGraphState 两代同源，契约压的是「同一份代码×两套栈实现」
        include 'com/sdzjz/client/StorageCoreAnimGeo.java' // m465 存储核心动画件几何（bbmodel 生成纯 float 表，零 import）
        include 'com/sdzjz/client/DataCableAnimGeo.java'   // m465 数据线能量脉冲几何（同上）
            include 'com/sdzjz/machine/SuperBenchRecipes.java' // m522（SB2）超大工作台配方表上挂（parse→ItemData.itemById）；m522b：菜单 handler 与网格库存两文件退回——引 src 注册表类与非白名单物品类、1.21 新类，作者 1.20.1 构建当场红；SB2b 用安装口+宿主口重做后再挂
    }
    into layout.buildDirectory.dir('xplat-subset-src')
}

sourceSets {
    main {
        java {
            srcDir '../../common/src/main/java'
            srcDir xplatSubset // 任务输出当源目录，Gradle 自动接依赖
        }
    }
}

// m443：GameTest 运行配置（照根构建 m297 逐字——loom 同为 1.7.4，经典线可用；
// gradlew runGametest 起临时服务器跑完即退，报告出 build/junit.xml）。
loom {
    runs {
        gametest {
            server()
            name = "GameTest"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/gametest"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
