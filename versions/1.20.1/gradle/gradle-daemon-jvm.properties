#m407 根构建（Fabric 1.21.1）守护进程 JVM 判据——Gradle 8.8+ 的 Daemon JVM criteria。
#
#背景：本仓现在是两代际两 JDK——
#  · 根构建 = MC 1.21.1 / Gradle 8.10 / Loom 1.7.4 → **必须跑在 JDK 21**（Gradle 8.10 不认 Java 23+）
#  · versions/26.2 子构建 = Gradle 9.5.1 → **必须跑在 JDK 25**
#作者机器上为了 26.2 装了 JDK 25 并成了默认 JAVA_HOME，于是根构建的守护进程也用 25 起，
#连 build.gradle 自己都编不过（"Unsupported class file major version 69"，69=Java 25）。
#
#有了本文件，无论 JAVA_HOME 指向谁，根构建都会挑本机已装的 JDK 21 起守护进程；
#找不到 21 会明说"没有匹配的 Java 安装"，比现在这个 class file 版本号的黑话好懂十倍。
#临时兜底（不改仓库时）：gradlew.bat -Dorg.gradle.java.home="C:\\路径\\jdk-21" build
toolchainVersion=21
