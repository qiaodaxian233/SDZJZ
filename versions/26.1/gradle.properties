# m432 Modern 第二靶（26.1 锚点，m402 作者拍板四锚点之一）——坐标出处：
# minecraft 26.1=2026-03-14 官方发布（fabricmc.net/2026/03/14/261.html，Gradle JVM 最低 JDK 25
# 自 26.1 起）；fabric_api 0.145.1+26.1=CurseForge 基线 26.1 格的 Latest release（2026-03-31，
# 26.1.x 补丁线的 0.155.x 只标 26.1.2 不取——m402"小版本不做"口径，锚死基线 26.1）；
# loader/loom 与 26.2 同（loader 版本无关 MC、loom 1.17 线即 26.x 新开发模型，m370 实测版沿用）。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 官方模板原话：IDEA 与新世代 Loom 的配置缓存兼容问题未收口，先关（fabric-loom#1349，26.2 同款）
org.gradle.configuration-cache=false

minecraft_version=26.1
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.145.1+26.1

# ⚠ 命令行跑本构建需要 Gradle JVM=25（26.1 起官方最低要求）。CI 由 setup-java 提供 25；
# 本机命令行默认 JDK 是 21 时按 versions/26.2/README.md 那招解注释下面这行改本机路径，勿提交。
# org.gradle.java.home=C:/Users/Administrator/.gradle/jdks/eclipse_adoptium-25-amd64-windows.2

# 版本号不在此文件：唯一数据源=根仓 gradle.properties 的 mod_version（m317 一笔一跳），
# build.gradle 读根文件拼 +mc26.1 尾缀，绝不双写。
